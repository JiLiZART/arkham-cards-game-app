# Build the game and publish it to GitHub Pages (https://jilizart.github.io/arkham-cards-game-app/)
# on every push to main, or by hand from the Actions tab. Nothing is published unless every check passes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push replaces a queued one, a running publish finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test, lint and check content
        run: |
          npm test
          npm run lint
          npm run check:content

      - name: Build for the Pages sub-path
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      # card scans are downloaded into the build (the CDN sends no CORS headers, WebGL needs them same-origin)
      - name: Restore card scans
        uses: actions/cache@v4
        with:
          path: .cache/cards
          key: card-scans-${{ hashFiles('content/packs/**/*.json', 'content/investigators/**') }}
          restore-keys: card-scans-

      - name: Fetch card scans
        run: npm run fetch:cards -- dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
