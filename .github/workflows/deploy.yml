# Build the game and publish it to GitHub Pages (https://arkham.artkost.dev, the repository's Pages custom domain)
# on every push to main, or by hand from the Actions tab. Nothing is published unless every check passes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push replaces a queued one, a running publish finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm first: setup-node's cache needs it on the PATH
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test, lint and check content
        run: |
          pnpm test
          pnpm lint
          pnpm check:content

      # the custom domain serves the game from its root; without one it would be /<repo>/ (set PAGES_BASE to that)
      - name: Build
        run: pnpm build
        env:
          PAGES_BASE: /

      # card scans are downloaded into the build (the CDN sends no CORS headers, WebGL needs them same-origin)
      - name: Restore card scans
        uses: actions/cache@v4
        with:
          path: .cache/cards
          key: card-scans-${{ hashFiles('content/packs/**/*.json', 'content/investigators/**') }}
          restore-keys: card-scans-

      - name: Fetch card scans
        run: pnpm fetch:cards dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # the net Worker (online play, ADR-0019) goes out after the site; if it fails the site stays published and online
  # play stays hidden until the next deploy. Skipped without the Cloudflare secrets.
  net:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # pinned: this job holds the Cloudflare token
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the net Worker
        # the secrets are this step's alone; skipped where they aren't set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare secrets: the net Worker is not deployed."; exit 0; fi
          VERSION="$(node -p "require('./package.json').version")+${GITHUB_SHA::7}"
          pnpm exec wrangler deploy -c worker/wrangler.toml --var "APP_VERSION:${VERSION}"
