schema: intent-driven

context: |
  Tech stack: TypeScript, React, React Three Fiber, Three.js
  We use conventional commits

#     Use senior-dev sub-agent for all src related work and senior-qa for acceptance tests.
#     Do not optimize the batch the tasks for senior-dev and senior-qa, call them as many times as necessary in smaller batches as dev and qa work may be interleaved.

# Models per step are set in .claude/commands/opsx/<step>.md frontmatter (model:):
#   explore, propose, update -> claude-fable-5-1; apply -> claude-sonnet-5-5; archive, sync -> claude-haiku-5-5

rules:
  proposal:
    - Must use grill-me skill
    # - Must use adversarial-authoring skill
    # - Must use glossary skill
  design:
    - Must use c4-diagrams skill
    # - Must use glossary skill
  adr:
    - Must use architectural-decision-records skill
  specs:
    # - Must use spec-as-source skill
  tasks:
    # - Must use spec-as-source skill

operations:
  apply:
    guidance:
      - Must use test-driven-development skill
  archive:
    guidance:
      - Must run OpenSpec Sync before archiving
