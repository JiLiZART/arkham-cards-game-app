# The net Worker: rooms for online play (ADR-0019). Secrets, set with `wrangler secret put`:
#   TURN_KEY_ID, TURN_KEY_TOKEN   a Cloudflare Calls TURN key (dashboard, Realtime, TURN)
name = "arkham-net"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# in front of the site, so signaling is on the site's own origin (the DNS record must be proxied)
routes = [{ pattern = "arkham.artkost.dev/net/*", zone_name = "artkost.dev" }]

[vars]
APP_VERSION = "dev"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
